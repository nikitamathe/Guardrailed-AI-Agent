version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: guardrailed-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  soc-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guardrailed-soc-engine
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: llama3
    ports:
      - "8000:8000"
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: guardrailed-streamlit
    depends_on:
      - soc-engine
    environment:
      API_BASE_URL: http://soc-engine:8000
    ports:
      - "8501:8501"
    restart: unless-stopped

volumes:
  ollama_data:
